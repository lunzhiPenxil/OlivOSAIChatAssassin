name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main, dev ]
    tags:
      - '*.*.*'
      - '*.*.*-*.*'
  pull_request:
    branches: [ main, dev ]

jobs:
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8
      - name: Run Flake8 Check
        run: |
          python -m flake8 . > flake8_output.log 2>&1
      - name: Show Flake8 Output
        if: failure()
        run: |
          cat flake8_output.log
      - name: Upload Flake8 Output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flake8_output
          path: ./flake8_output.log

  test:
    name: Tests and coverage
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COVERAGE_FILE: test-results/.coverage
      OLIVOS_SOURCE: ${{ github.workspace }}/.ci/OlivOS
      PYSTRAY_BACKEND: dummy
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
      - name: Checkout OlivOS host
        uses: actions/checkout@v4
        with:
          repository: OlivOS-Team/OlivOS
          ref: main
          path: .ci/OlivOS
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .ci/OlivOS/pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./.ci/OlivOS[test]"
      - name: Run tests with line and branch coverage
        run: |
          mkdir -p test-results
          python -m pytest tests \
            --cov=OlivOSAIChatAssassin \
            --cov-branch \
            --cov-context=test \
            --cov-report=term-missing \
            --cov-report=xml:test-results/coverage.xml \
            --cov-report=json:test-results/coverage.json \
            --cov-report=html:test-results/html \
            --junitxml=test-results/junit.xml
      - name: Summarize coverage
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path('test-results/coverage.json')
          if not path.is_file():
              print('coverage.json 未生成，跳过摘要。')
              raise SystemExit(0)
          report = json.loads(path.read_text(encoding='utf-8'))
          totals = report['totals']
          branches = totals.get('num_branches', 0)
          covered_branches = totals.get('covered_branches', 0)
          branch_percent = totals.get('percent_branches_covered', 0)
          lines = [
              '## OlivOSAIChatAssassin 覆盖率',
              '',
              f"- 行覆盖率：{totals.get('percent_statements_covered', 0):.2f}%",
              f"- 已覆盖行：{totals['covered_lines']} / {totals['num_statements']}",
              f"- 分支覆盖率：{branch_percent:.2f}%",
              f"- 已覆盖分支：{covered_branches} / {branches}",
              f"- 行与分支综合覆盖率：{totals.get('percent_covered', 0):.2f}%",
              '',
              '### 缺口最大的文件',
              '',
              '| 文件 | 缺失行 | 缺失分支 | 行覆盖率 |',
              '| --- | ---: | ---: | ---: |',
          ]
          rows = []
          for name, data in report['files'].items():
              summary = data['summary']
              rows.append((
                  summary.get('missing_lines', 0) + summary.get('missing_branches', 0),
                  name,
                  summary.get('missing_lines', 0),
                  summary.get('missing_branches', 0),
                  summary.get('percent_statements_covered', 0),
              ))
          for _, name, missing_lines, missing_branches, percent in sorted(rows, reverse=True)[:10]:
              lines.append(f'| `{name}` | {missing_lines} | {missing_branches} | {percent:.2f}% |')
          text = '\n'.join(line for line in lines if line is not None) + '\n'
          print(text)
          summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary_path:
              with open(summary_path, 'a', encoding='utf-8') as summary_file:
                  summary_file.write(text)
          PY
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          include-hidden-files: true

  build:
    name: Build OPK
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PACK_NAME: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Pack
        run: |
          if [ ! "$PACK_NAME" ]; then
              PACK_NAME=${GITHUB_REPOSITORY##*/}
          fi
          echo "PACK_NAME=$PACK_NAME" >> "$GITHUB_ENV"
          cd "$PACK_NAME"
          zip -r "../$PACK_NAME.opk" ./
      - name: Repack
        run: |
          ZIP_NAME="${{ env.PACK_NAME }}-${{ github.ref_name }}"
          ZIP_NAME=$(echo "$ZIP_NAME" | tr / -)
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"
          zip -j "./$ZIP_NAME.zip" "./${{ env.PACK_NAME }}.opk"
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: |
            ${{ env.PACK_NAME }}.opk
      - name: Draft Release
        if: github.ref_type == 'tag'
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          draft: true
          allowUpdates: true
          removeArtifacts: true
          artifacts: |
            ./${{ env.PACK_NAME }}.opk
            ./${{ env.ZIP_NAME }}.zip
