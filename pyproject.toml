[build-system]
requires = ["setuptools>=63.2.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "olivos-plugin-OlivOSAIChatAssassin"
version = "1.4.1"
description = "基于OpenAI兼容API的群聊AI助手，会收集聊天记录并择机加入群聊"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "仑质"}
]
license = {text = "AGPLv3 License"}
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "olivos",
    "requests",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4,<9",
    "pytest-cov>=5,<7",
]

[project.urls]
Repository = "https://github.com/lunzhiPenxil/OlivOSAIChatAssassin"
Issues = "https://github.com/lunzhiPenxil/OlivOSAIChatAssassin/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["OlivOSAIChatAssassin"]
branch = true
relative_files = true

[tool.coverage.report]
precision = 2
show_missing = true

[tool.coverage.html]
directory = "test-results/html"
